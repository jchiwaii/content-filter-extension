<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Safe Browse</title>
  <link rel="icon" href="../../assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="passwordLock" class="password-lock hidden">
    <div class="lock-content">
      <img class="lock-logo" src="../../assets/logo.svg" width="64" height="58" alt="Safe Browse">
      <h3>Settings Locked</h3>
      <div class="input-group">
        <input type="password" id="passwordInput" placeholder="Enter password" aria-label="Password" autocomplete="current-password">
      </div>
      <button id="unlockBtn" class="btn btn-primary">Unlock Settings</button>
      <p class="error hidden" id="passwordError" role="alert">Incorrect password</p>
    </div>
  </div>

  <div class="popup-container" id="mainContent">
    <header class="header">
      <div class="header-left">
        <div class="header-title-line">
          <h1>Safe Browse</h1>
          <span class="status-badge" id="statusBadge" role="status">Active</span>
        </div>
        <p>Soap for the Internet.</p>
      </div>
      <div class="header-right">
        <label class="main-toggle">
          <input type="checkbox" id="mainToggle" aria-label="Enable protection" role="switch" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>
    </header>

    <section class="quick-stats" aria-label="Filtering statistics">
      <div class="stat-item">
        <span class="stat-value" id="wordsFilteredToday">0</span>
        <span class="stat-label">Filtered today</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-item">
        <span class="stat-value" id="totalFiltered">0</span>
        <span class="stat-label">All time</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-item">
        <span class="stat-value" id="sitesBlocked">0</span>
        <span class="stat-label">Sites blocked</span>
      </div>
    </section>

    <section class="quick-actions" aria-label="Quick actions">
      <button class="action-btn" id="pauseBtn">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" class="action-icon"><rect width="4" height="16" x="6" y="4" rx="1"/><rect width="4" height="16" x="14" y="4" rx="1"/></svg>
        <span>Pause for 1 hour</span>
      </button>
      <button class="action-btn" id="whitelistBtn">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="action-icon"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2-1 4-2 7-2 2.89 0 5.13 1 6.78 1.18a1 1 0 0 1 .83 1Z"/><path d="m9 12 2 2 4-4"/></svg>
        <span>Trust this site</span>
      </button>
    </section>

    <section class="settings-section">
      <div class="setting-row">
        <div class="setting-info">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="setting-icon"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" x2="15" y1="20" y2="20"/><line x1="12" x2="12" y1="4" y2="20"/></svg>
          <span>Text filtering</span>
        </div>
        <label class="toggle">
          <input type="checkbox" id="filterTextToggle" aria-label="Text filtering" role="switch" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>
      <div class="setting-row">
        <div class="setting-info">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="setting-icon"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
          <span>Image filtering</span>
        </div>
        <label class="toggle">
          <input type="checkbox" id="filterImagesToggle" aria-label="Image filtering" role="switch" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>
      <div class="setting-row">
        <div class="setting-info">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="setting-icon"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <span>Safe search</span>
        </div>
        <label class="toggle">
          <input type="checkbox" id="safeSearchToggle" aria-label="Safe search" role="switch" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>
      <div class="setting-row">
        <div class="setting-info">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="setting-icon"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
          <span>Site blocking</span>
        </div>
        <label class="toggle">
          <input type="checkbox" id="blockSitesToggle" aria-label="Site blocking" role="switch" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>
    </section>

    <section class="collapsible-section">
      <button class="collapsible-header" id="customWordsHeader" aria-expanded="false" aria-controls="customWordsContent">
        <span>Custom words</span>
        <svg class="collapse-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div class="collapsible-content" id="customWordsContent">
        <div class="input-group">
          <input type="text" id="customWordInput" aria-label="Custom words or patterns" placeholder="Words, phrases, or /pattern/i">
          <button id="addWordBtn" class="btn btn-small">Add</button>
        </div>
        <div class="tags-list" id="customWordsList"></div>
      </div>
    </section>

    <section class="collapsible-section">
      <button class="collapsible-header" id="whitelistHeader" aria-expanded="false" aria-controls="whitelistContent">
        <span>Trusted sites</span>
        <svg class="collapse-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div class="collapsible-content" id="whitelistContent">
        <div class="whitelist-list" id="whitelistList"></div>
      </div>
    </section>

    <section id="reviewPrompt" class="review-prompt" aria-labelledby="reviewTitle" hidden>
      <h2 id="reviewTitle">Enjoying Safe Browse?</h2>
      <p>Share your experience on the Chrome Web Store.</p>
      <button id="reviewStars" class="review-stars" aria-label="Leave a review on the Chrome Web Store" title="Leave a review">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9Z"/></svg>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9Z"/></svg>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9Z"/></svg>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9Z"/></svg>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9Z"/></svg>
      </button>
      <div class="review-actions">
        <button id="reviewOpen" class="btn">Leave a review</button>
        <button id="reviewDismiss" class="review-dismiss">No thanks</button>
      </div>
      <p id="reviewError" role="alert" hidden>Could not open the store. Please try again.</p>
    </section>
  </div>

  <script src="../../src/modules/password.js"></script>
  <script src="popup.js"></script>
  <script src="review.js"></script>
</body>
</html>
